<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f4" />
    <meta name="description" content="Şantiyelere giden malzeme, maliyet, cari hesap, vade ve avans takibi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="İnşaat Takip" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>İnşaat Takip</title>
    <script>
      /* İlk boyamada doğru tema: kayıtlı seçim, yoksa sistem ayarı */
      try {
        var t = localStorage.getItem('insaat-tema')
        if (t !== 'acik' && t !== 'koyu') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'koyu' : 'acik'
        if (t === 'koyu') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
